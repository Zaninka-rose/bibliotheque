name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bibliotheque-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Run test suite
        run: ./mvnw -B clean test -Dspring.profiles.active=test

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: bibliotheque-backend/target/surefire-reports/
          if-no-files-found: ignore
