<section class="splash-hero">
  <div class="splash-logo" aria-hidden="true">📖</div>

  <h1 class="splash-title">{{ 'Library Management System' | t }}</h1>
  <p class="splash-subtitle">
    Votre bibliothèque, dans votre poche. Catalogue en direct, réservations
    en un clic et suivi de vos emprunts — même hors connexion.
  </p>

  <div class="splash-features">
    @for (f of features; track f.title) {
      <div class="splash-feature">
        <div class="icon" aria-hidden="true">{{ f.icon }}</div>
        <h3>{{ f.title }}</h3>
        <p>{{ f.text }}</p>
      </div>
    }
  </div>

  <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
    <a routerLink="/login" class="btn btn-primary btn-lg px-4">
      {{ 'Sign in' | t }}
    </a>
    <a routerLink="/register" class="btn btn-outline-primary btn-lg px-4">
      Créer un compte
    </a>
  </div>
</section>
