server.port=8080

# PostgreSQL lancé via docker compose (à la racine du projet) :
#   docker compose up -d
# En conteneur Docker, la variable DB_URL pointe vers le service compose "postgres".
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/bibliotheque}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Swagger UI - ancienne URL compatible
springdoc.swagger-ui.path=/swagger-ui.html
