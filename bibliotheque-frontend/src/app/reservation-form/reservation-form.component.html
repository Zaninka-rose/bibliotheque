<div class="reservation-form">
  <h3>Créer une réservation</h3>

  <!-- Messages de succès -->
  @if (successMessage) {
    <div class="alert alert-success alert-dismissible fade show" role="alert">
      {{ successMessage }}
      <button type="button" class="btn-close" (click)="successMessage = ''"></button>
    </div>
  }

  <!-- Messages d'erreur -->
  @if (errorMessage) {
    <div class="alert alert-danger alert-dismissible fade show" role="alert">
      {{ errorMessage }}
      <button type="button" class="btn-close" (click)="errorMessage = ''"></button>
    </div>
  }

  <form (ngSubmit)="onSubmit()">
    <div class="row g-3">
      <div class="col-12 col-md-6">
        <label for="livre" class="form-label">Livre</label>
        <select id="livre" class="form-select"
                [(ngModel)]="selectedLivreId" name="livre">
          <option [ngValue]="null" disabled>-- Sélectionnez un livre --</option>
          @for (book of books; track book.bookId) {
            <option [ngValue]="book.bookId">{{ book.bookName }} — {{ book.bookAuthor }}</option>
          }
        </select>
      </div>

      <div class="col-12 col-md-6">
        <label for="adherent" class="form-label">Adhérent</label>
        <select id="adherent" class="form-select"
                [(ngModel)]="selectedAdherentId" name="adherent">
          <option [ngValue]="null" disabled>-- Sélectionnez un adhérent --</option>
          @for (user of users; track user.userId) {
            <option [ngValue]="user.userId">{{ user.name }} ({{ user.username }})</option>
          }
        </select>
      </div>
    </div>

    <div class="mt-3">
      <button type="submit" class="btn btn-success"
              [disabled]="!isFormValid || loading">
        @if (loading) {
          <span class="spinner-border spinner-border-sm me-1"></span>
        }
        Créer la réservation
      </button>
    </div>
  </form>
</div>
