<h2>User List</h2>
<table class="table table-success table-striped">
  <thead>
    <tr>
      <th> User ID </th>
      <th> Name </th>
      <th> Username </th>
      <th> Role </th>
      <th> View History </th>
      <th> Edit User </th>
    </tr>
  </thead>
  <tbody>
    @for (user of users; track user) {
      <tr>
        <td> {{ user.userId }} </td>
        <td> {{ user.name }} </td>
        <td> {{ user.username }} </td>
        <td> {{ user.role[0].roleName }} </td>
        <td>
          @if (user.role[0].roleName === 'User') {
            <div>
              <button (click) = "userDetails(user.userId)" class="btn btn-success"> View </button>
            </div>
          }
        </td>
        <td>
          <button (click) = "updateUser(user.userId)" class="btn btn-info"> Edit </button>
        </td>
      </tr>
    }
  </tbody>
</table>
