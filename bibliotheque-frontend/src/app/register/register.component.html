<div class="app-card auth-card">
  @if (success) {
    <div class="text-center py-3">
      <div style="font-size: 2.4rem;" aria-hidden="true">✅</div>
      <h3 class="mt-2">Compte créé !</h3>
      <p class="text-muted-2">Bienvenue à la bibliothèque, {{ name }}.
        Vous pouvez dès à présent vous connecter.</p>
      <button type="button" class="btn btn-primary mt-2" (click)="goToLogin()">
        Se connecter
      </button>
    </div>
  } @else {
    <h3 class="mb-1">Créer un compte</h3>
    <p class="page-subtitle mb-3">Rejoignez la bibliothèque en tant qu'adhérent.</p>

    @if (errorMessage) {
      <div class="alert alert-danger" role="alert">{{ errorMessage }}</div>
    }

    <form (ngSubmit)="onSubmit()" autocomplete="off">
      <div class="mb-3">
        <label class="form-label" for="regName">Nom complet</label>
        <input type="text" class="form-control" id="regName"
               name="name" [(ngModel)]="name"
               placeholder="Ex. Rose Dupont" required>
      </div>

      <div class="mb-3">
        <label class="form-label" for="regUsername">Nom d'utilisateur</label>
        <input type="text" class="form-control" id="regUsername"
               name="username" [(ngModel)]="username"
               placeholder="Ex. rdupont" required>
      </div>

      <div class="mb-3">
        <label class="form-label" for="regPassword">Mot de passe</label>
        <input type="password" class="form-control" id="regPassword"
               name="password" [(ngModel)]="password"
               placeholder="••••••••" required minlength="4">
      </div>

      <button type="submit" class="btn btn-primary w-100"
              [disabled]="loading">
        @if (loading) {
          <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>
        }
        Créer mon compte
      </button>
    </form>

    <p class="text-center mt-3 mb-0 text-muted-2">
      Déjà inscrit ?
      <a routerLink="/login">Se connecter</a>
    </p>
  }
</div>
